[dependencies]
anyhow = "1.0"
colored = "2.0"
dialoguer = "0.11"
glob = "0.3"
indicatif = "0.17"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

[dependencies.chrono]
features = ["serde"]
version = "0.4"

[dependencies.clap]
features = ["derive"]
version = "4.0"

[dependencies.semver]
features = ["serde"]
version = "1.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.uuid]
features = ["v4"]
version = "1.0"

[dev-dependencies]
serial_test = "3.0"
tempfile = "3.0"

[package]
authors = ["Alex Buck"]
categories = [
    "command-line-utilities",
    "development-tools",
]
description = "Universal changeset management tool for all programming languages"
edition = "2021"
keywords = [
    "changeset",
    "version",
    "release",
    "monorepo",
    "changelog",
]
license = "MIT"
name = "verset"
repository = "https://github.com/alexjbuck/verset"
version = "0.1.0"
