[package]
name = "verset"
version = "0.1.0"
edition = "2021"
authors = ["Alex Buck"]
description = "Universal changeset management tool for all programming languages"
license = "MIT"
repository = "https://github.com/alexjbuck/verset"
keywords = ["changeset", "version", "release", "monorepo", "changelog"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
glob = "0.3"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dialoguer = "0.11"
indicatif = "0.17"
colored = "2.0"
